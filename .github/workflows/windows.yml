name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Check setup prerequisites
        shell: powershell
        run: .\scripts\setup.ps1 -CheckOnly
      - name: Run listener tests
        run: node --test
      - name: Run Windows launcher tests
        run: python -B test/silent-launcher.test.py
