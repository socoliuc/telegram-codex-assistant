<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="368" viewBox="0 0 1000 368" role="img" aria-labelledby="title desc">
  <title id="title">One project reply, then back to Auto</title>
  <desc id="desc">Illustrated example. Open and reply sends a heading request to the Atlas project. Auto sends the next question about a hexagon to General.</desc>
  <rect width="1000" height="368" rx="20" fill="#122522"/>
  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="48" y="63" fill="#c6f478" font-size="19" font-weight="600">Open &amp; reply</text>
    <text x="48" y="127" fill="#faf9eb" font-size="52" font-weight="650">One reply.</text>
    <text x="48" y="185" fill="#faf9eb" font-size="52" font-weight="650">Back to Auto.</text>
    <path d="M49 225 H310 Q330 225 330 245 V268 Q330 286 348 286 H397" fill="none" stroke="#84aa95" stroke-width="2.5"/>
    <circle cx="49" cy="225" r="5" fill="#c6f478"/>
    <path d="m386 277 11 9-11 9" fill="none" stroke="#c6f478" stroke-width="2.5"/>
    <rect x="444" y="32" width="516" height="141" rx="15" fill="#e6f4d9"/>
    <circle cx="477" cy="63" r="7" fill="#376c4f"/>
    <text x="496" y="70" fill="#2f6148" font-size="19" font-weight="700">Atlas project</text>
    <text x="469" y="112" fill="#173528" font-size="24">Suggest a heading for this guide.</text>
    <text x="469" y="146" fill="#385147" font-size="21">↳ A field guide to urban trees</text>
    <path d="M475 173 V197" stroke="#91aa9b" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="444" y="197" width="516" height="140" rx="15" fill="#e1eef5"/>
    <circle cx="477" cy="228" r="7" fill="#346880"/>
    <text x="496" y="235" fill="#315e74" font-size="19" font-weight="700">General</text>
    <text x="469" y="275" fill="#183746" font-size="24">How many sides does a hexagon have?</text>
    <text x="469" y="309" fill="#3c5360" font-size="21">↳ Six.</text>
  </g>
</svg>
